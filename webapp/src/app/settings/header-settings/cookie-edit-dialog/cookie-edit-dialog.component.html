<nz-modal nzTitle="修改 Cookie" nzCentered [(nzVisible)]="visible">
  <ng-container *nzModalContent>
    <div class="qrcode-container" *ngIf="qrcodeVisible">
      <canvas #qrcodeCanvas class="qrcode" *ngIf="!qrcodeLoading"></canvas>
      <div class="qrcode-status" *ngIf="qrcodeLoading">
        <nz-spin nzSimple></nz-spin>
        <div class="qrcode-status-tip">
          {{ qrcodeLoginFailed ? '获取二维码出错' : '正在获取二维码...' }}
        </div>
      </div>
      <div class="qrcode-status-tip" *ngIf="!qrcodeLoading">
        {{ qrcodeStatusTip }}
      </div>
      <button
        nz-button
        nzType="link"
        nzSize="small"
        *ngIf="qrcodeExpired || qrcodeLoginFailed"
        (click)="refreshQrCode()"
      >
        刷新二维码
      </button>
    </div>
    <form nz-form [formGroup]="settingsForm">
      <nz-form-item>
        <nz-form-control
          [nzWarningTip]="warningTip"
          [nzValidateStatus]="
            control.valid && control.value.trim() !== value
              ? 'warning'
              : control
          "
        >
          <textarea
            [rows]="5"
            wrap="soft"
            nz-input
            formControlName="cookie"
          ></textarea>
        </nz-form-control>
      </nz-form-item>
    </form>
  </ng-container>
  <ng-template [nzModalFooter]>
    <button nz-button nzType="default" (click)="toggleQrcode()">
      {{ qrcodeVisible ? '收起扫码登录' : '扫码登录' }}
    </button>
    <button
      nz-button
      nzType="primary"
      (click)="testCookie()"
      [disabled]="control.value.trim() === ''"
    >
      测试
    </button>
    <button nz-button nzType="default" (click)="handleCancel()">取消</button>
    <button
      nz-button
      nzType="primary"
      nzDanger
      (click)="handleConfirm()"
      [disabled]="control.invalid || control.value.trim() === value"
    >
      确定
    </button>
  </ng-template>
</nz-modal>
